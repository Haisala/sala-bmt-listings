name: bridge-mvp-issue-event

on:
  issues:
    types: [opened, labeled]

jobs:
  candidate:
    if: github.repository == 'Haisala/sala-bmt-listings' && github.actor == 'Haisala' && startsWith(github.event.issue.title, '[BRIDGE-MVP]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Create sanitized candidate
        env:
          ISSUE_JSON: ${{ toJson(github.event.issue) }}
          EVENT_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, sys
          issue = json.loads(os.environ["ISSUE_JSON"])
          body = issue.get("body") or ""
          lines = body.splitlines()
          def scalar(name):
              prefix = name + ":"
              for line in lines:
                  if line.startswith(prefix):
                      return line.split(":", 1)[1].strip()
              return ""
          def block(name, next_names):
              start = next((i for i, line in enumerate(lines) if line.startswith(name + ":")), None)
              if start is None:
                  return []
              out = []
              for line in lines[start + 1:]:
                  if any(line.startswith(n + ":") for n in next_names):
                      break
                  value = line.strip()
                  if value.startswith("-"):
                      value = value[1:].strip()
                  if value:
                      out.append(value)
              return out
          task_id = scalar("TASK_ID")
          project = scalar("PROJECT")
          status = scalar("STATUS")
          objective = scalar("OBJECTIVE")
          scope = scalar("SCOPE")
          acceptance = block("ACCEPTANCE_CRITERIA", ["SCOPE", "NO_CUSTOMER_DATA"])
          if not all([task_id, project, status == "READY", objective, scope]) or not acceptance:
              print("MISSING_OR_EMPTY_ACCEPTANCE_CRITERIA", file=sys.stderr)
              raise SystemExit(1)
          base = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "issue_number": issue["number"],
              "issue_url": issue["html_url"],
              "event_id": os.environ["EVENT_ID"],
              "event_name": os.environ["EVENT_NAME"],
              "task_id": task_id,
              "objective": objective,
              "acceptance_criteria": acceptance,
              "scope": scope,
          }
          canonical = json.dumps(base, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
          now = datetime.datetime.now(datetime.timezone.utc)
          candidate = {
              **base,
              "schema_version": "bridge-mvp-v1",
              "candidate_id": f"bridge-mvp-{issue['number']}-{os.environ['EVENT_ID']}",
              "task_digest": "sha256:" + hashlib.sha256(canonical.encode()).hexdigest(),
              "status": "READY_FOR_BROKER",
              "created_at": now.isoformat(),
              "expires_at": (now + datetime.timedelta(hours=1)).isoformat(),
          }
          pathlib.Path("candidate.json").write_text(json.dumps(candidate, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-mvp-candidate-${{ github.event.issue.number }}-${{ github.run_id }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 1
