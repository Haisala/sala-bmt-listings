name: bridge-mvp-issue-event

on:
  issues:
    types: [opened, labeled]

jobs:
  candidate:
    if: github.repository == 'Haisala/sala-bmt-listings' && github.actor == 'Haisala' && startsWith(github.event.issue.title, '[BRIDGE-MVP]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Create sanitized candidate
        id: candidate
        env:
          ISSUE_JSON: ${{ toJson(github.event.issue) }}
          EVENT_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, sys
          issue=json.loads(os.environ['ISSUE_JSON'])
          body=issue.get('body') or ''
          required=('TASK_ID','STATUS: READY','OBJECTIVE','ACCEPTANCE_CRITERIA')
          if not all(x in body for x in required):
              print('candidate filter rejected: missing schema marker', file=sys.stderr); raise SystemExit(1)
          def field(name):
              for line in body.splitlines():
                  if line.startswith(name+':'): return line.split(':',1)[1].strip()
              return ''
          task_id=field('TASK_ID')
          objective=field('OBJECTIVE')
          acceptance=field('ACCEPTANCE_CRITERIA')
          base={'repository':os.environ['GITHUB_REPOSITORY'],'issue_number':issue['number'],'issue_url':issue['html_url'],'event_id':os.environ['EVENT_ID'],'event_name':os.environ['EVENT_NAME'],'task_id':task_id,'objective':objective,'acceptance_criteria':acceptance}
          canonical=json.dumps(base,sort_keys=True,separators=(',',':'),ensure_ascii=False)
          candidate={**base,'schema_version':'bridge-mvp-v1','candidate_id':f"bridge-mvp-{issue['number']}-{os.environ['EVENT_ID']}",'task_digest':'sha256:'+hashlib.sha256(canonical.encode()).hexdigest(),'status':'READY_FOR_BROKER','created_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'expires_at':(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(hours=1)).isoformat()}
          out=pathlib.Path('candidate.json'); out.write_text(json.dumps(candidate,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-mvp-candidate-${{ github.event.issue.number }}-${{ github.run_id }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 1
